name: Run Custom Command
on:
  workflow_dispatch: # This allows you to click a button in GitHub to run it

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Script
        run: |
          mv SEO_Intelligence/* .
          mv SEO_Intelligence/.* .
          git add .
          git commit -m "moved"
          git push origin main
          
