name: Uganda SEO Intelligence Research

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      SCRAPING_API_KEY: ${{ secrets.SCRAPING_API_KEY }}
      SCRAPING_API_URL: ${{ vars.SCRAPING_API_URL }}
      SCRAPING_API_KEY_HEADER: ${{ vars.SCRAPING_API_KEY_HEADER || 'Authorization' }}
      SCRAPING_API_KEY_PREFIX: ${{ vars.SCRAPING_API_KEY_PREFIX || 'Bearer ' }}
      SERPER_COUNTRY: ug
      SERPER_LANGUAGE: en
      SERPER_MAX_SEARCHES: 2500
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        working-directory: SEO_Intelligence
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate configuration
        working-directory: SEO_Intelligence
        run: python -m src.main --dry-run

      - name: Run resumable research
        working-directory: SEO_Intelligence
        run: python -m src.main --mode full --resume

      - name: Commit generated research artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f SEO_Intelligence/data/final \
            SEO_Intelligence/reports/uganda_seo_intelligence_report.html
          if [ -f SEO_Intelligence/reports/uganda_seo_intelligence_report.pdf ]; then
            git add -f SEO_Intelligence/reports/uganda_seo_intelligence_report.pdf
          fi
          if [ -f SEO_Intelligence/data/seo_intelligence.db ]; then
            git add -f SEO_Intelligence/data/seo_intelligence.db
          fi
          if [ -f SEO_Intelligence/data/errors.log ]; then
            git add -f SEO_Intelligence/data/errors.log
          fi
          git diff --cached --quiet || git commit -m "Update Uganda SEO intelligence research"
          git push
